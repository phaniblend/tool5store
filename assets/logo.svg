<svg width="1200" height="520" viewBox="0 0 1200 520" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@700;800;900&amp;display=swap');
      .wordmark { font-family: 'Poppins', 'Montserrat', 'Segoe UI', Arial, sans-serif; font-weight: 800; }
      .tagline { font-family: 'Poppins', 'Montserrat', 'Segoe UI', Arial, sans-serif; font-weight: 600; }
    </style>
    <filter id="paperTexture" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" seed="4" result="noise"/>
      <feColorMatrix in="noise" type="matrix"
        values="0 0 0 0 0.05
                0 0 0 0 0.05
                0 0 0 0 0.05
                0 0 0 0.035 0"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="1200" height="520" fill="#f6f4ef"/>
  <rect x="0" y="0" width="1200" height="520" filter="url(#paperTexture)"/>

  <text class="wordmark" x="50" y="300" font-size="190" fill="#132c4a">Tool</text>

  <g>
    <text class="wordmark" x="608" y="345" font-size="330" fill="#ef8f27" transform="translate(14,10)">5</text>
    <text class="wordmark" x="598" y="335" font-size="330" fill="#132c4a">5</text>
    <path d="M 718 55 Q 706 205 718 380"
          fill="none" stroke="#132c4a" stroke-width="18" stroke-linecap="round"/>
  </g>

  <text class="tagline" x="600" y="470" font-size="27" letter-spacing="4" fill="#132c4a" text-anchor="middle">SIMPLE TOOLS FOR BRILLIANT MINDS</text>
</svg>
